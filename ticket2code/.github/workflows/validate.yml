name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          test -f VERSION
          test -f README.md
          test -f installers/install.sh
          test -f installers/upgrade.sh
          test -f installers/doctor.sh
          test -f core/hooks/scripts/pre_tool_guard.py

      - name: Validate bash scripts syntax
        run: |
          bash -n installers/install.sh
          bash -n installers/upgrade.sh
          bash -n installers/doctor.sh
          bash -n installers/uninstall.sh

      - name: Validate hook python syntax
        run: |
          python3 -m py_compile core/hooks/scripts/pre_tool_guard.py

      - name: Validate executable bits
        run: |
          test -x installers/install.sh
          test -x installers/upgrade.sh
          test -x installers/doctor.sh
          test -x installers/uninstall.sh
