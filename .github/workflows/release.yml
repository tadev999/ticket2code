name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build archive
        run: |
          VERSION_VALUE=$(cat VERSION)
          ARCHIVE="ticket2code-core-${VERSION_VALUE}.tar.gz"
          tar -czf "$ARCHIVE" \
            README.md LICENSE CHANGELOG.md VERSION \
            docs core workflows templates bin package.json .github
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ticket2code-core
          path: ${{ env.ARCHIVE }}

      - name: Create GitHub Release (for tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
