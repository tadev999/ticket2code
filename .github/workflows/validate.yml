name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          test -f VERSION
          test -f README.md
          test -f package.json
          test -f bin/t2c.js
          test -f core/hooks/scripts/pre_tool_guard.py

      - name: Validate CLI syntax
        run: |
          node --check bin/t2c.js

      - name: Validate hook python syntax
        run: |
          python3 -m py_compile core/hooks/scripts/pre_tool_guard.py
